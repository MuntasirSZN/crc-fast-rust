[package]
name = "crc-fast"
version = "1.10.0"
edition = "2021"
description = "World's fastest generic CRC-5,8,16,31,32,64 calculator using SIMD, with a C compatible shared library."
repository = "https://github.com/awesomized/crc-fast-rust"
license = "(MIT OR Apache-2.0) AND Zlib"
keywords = ["accelerated", "checksum", "crc", "fast", "simd"]
categories = ["algorithms", "encoding", "hardware-support"]

# important intrinsics stabilization notes:
# 1.69.0 added VPCLMULQDQ x86 detection support
# 1.70.0 added LLVM 16 which supports PMULL2 on Aarch64
# 1.89.0 stabilized AVX-512 intrinsics, including VPCLMULQDQ
rust-version = "1.89"

[package.metadata.docs.rs]
features = ["std"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
bench = true
crate-type = ["cdylib", "rlib"]
name = "crc_fast"

[[bin]]
name = "checksum"
path = "src/bin/checksum.rs"
required-features = ["cli"]

[[bin]]
name = "arch-check"
path = "src/bin/arch-check.rs"
required-features = ["cli"]

[[bin]]
name = "get-custom-params"
path = "src/bin/get-custom-params.rs"
required-features = ["cli"]

[[bin]]
name = "generate-tables"
path = "src/bin/generate-tables.rs"
required-features = ["cli"]

[[test]]
name = "checksum_integration_tests"
path = "tests/checksum_integration_tests.rs"
required-features = ["cli"]

[[bench]]
harness = false
name = "benchmark"
required-features = ["std"]

[dependencies]
# We use digest with default-features = false and features = ["alloc"] to enable heap allocation support in no_std
# environments. This configuration is safe because the alloc feature in digest does not depend on its default features
digest = { version = "0.11", default-features = false, features = ["alloc"], optional = true }

# spin for no_std-friendly Once/Mutex/RwLock (always required for feature detection)
spin = { version = "0.12.3", default-features = false, features = ["barrier", "mutex", "once", "rwlock", "spin_mutex"] }

hashbrown = { version = "0.17.1", optional = true }

# context-aware error handling (no_std, alloc) - replaces panic/unwrap, only when alloc available
exn = { version = "0.4.0-rc.1", default-features = false, optional = true }

[dev-dependencies]
crc = "3.4"
rand = "0.10"

# Browser/Node-only (`target_os = "unknown"`): `wasm-bindgen` cannot target
# WASI, and the `wasm_js` backend pulls `js-sys` (likewise unknown-only).
# WASI builds fall back to the default backends (WASI random).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
# `wasm_js` on both getrandom majors in the dev graph (`rand 0.10` -> 0.4,
# `proptest` -> `rand 0.9` -> 0.3). The 0.3 line additionally needs
# `--cfg getrandom_backend="wasm_js"` (see .cargo/config.toml).
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
wasm-bindgen-test = "0.3"

[target.'cfg(any(target_arch = "aarch64", target_arch = "x86", target_arch = "x86_64"))'.dependencies]
cpufeatures = "0.3"

# Full proptest (with fork/timeout) and criterion (with rayon) on host;
# `rusty-fork`/`wait-timeout` and rayon cannot compile for wasm, so wasm
# builds get the no-fork proptest subset and featureless criterion (benches
# never execute under wasm-pack; the dep only needs to build).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8"
proptest = "1.11"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
criterion = { version = "0.8", default-features = false }
proptest = { version = "1.11", default-features = false, features = ["bit-set", "std"] }

[features]
# default features
default = ["ffi", "panic-handler", "std"]
alloc = ["digest", "exn"]  # marker feature for heap allocation support
cache = ["alloc", "hashbrown"]  # caching requires alloc + hashbrown
# optional features
cli = ["std"]  # command line interface binaries (checksum, arch-check, get-custom-params)
ffi = ["std"]  # ffi currently requires std (uses hashbrown/spin/alloc and std file IO)
panic-handler = []  # Provides panic handler for no_std library checks (disable in binaries)
std = ["alloc", "hashbrown"]  # std implies alloc + hashbrown for cache

# lto=true has a big improvement in performance
[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
